<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark luxury backdrop -->
    <radialGradient id="luxBg" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#181e29"/>
      <stop offset="55%" stop-color="#0b0e14"/>
      <stop offset="100%" stop-color="#050608"/>
    </radialGradient>

    <!-- Bevel ring & subtle luxury border -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Chevy Bowtie Satin Gold Gradient -->
    <linearGradient id="chevyGold" x1="25%" y1="0%" x2="75%" y2="100%">
      <stop offset="0%" stop-color="#fff3b0"/>
      <stop offset="22%" stop-color="#e5b342"/>
      <stop offset="50%" stop-color="#d49a24"/>
      <stop offset="78%" stop-color="#b87b14"/>
      <stop offset="100%" stop-color="#8a5608"/>
    </linearGradient>

    <!-- Inner Core Bevel Highlight -->
    <linearGradient id="goldCore" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffbe8" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#f5c252" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#a66e0a" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Chrome Bevel Stroke -->
    <linearGradient id="goldEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe899"/>
      <stop offset="35%" stop-color="#b88320"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#593a04"/>
    </linearGradient>

    <!-- Drop Shadows for depth -->
    <filter id="elevate" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.75"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#d49a24" flood-opacity="0.2"/>
    </filter>

    <filter id="subtleGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="32" result="blur"/>
    </filter>
  </defs>

  <!-- iOS App Icon Canvas (Square - iOS applies standard squircle mask) -->
  <rect width="512" height="512" fill="url(#luxBg)"/>

  <!-- Radial Golden Ambient Under-glow -->
  <circle cx="256" cy="256" r="140" fill="#d49a24" opacity="0.12" filter="url(#subtleGlow)"/>

  <!-- Ultra-fine Precision Caliper Grid (Mechanical Elegance) -->
  <circle cx="256" cy="256" r="228" fill="none" stroke="url(#rimGrad)" stroke-width="1.5"/>
  <circle cx="256" cy="256" r="195" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1" stroke-dasharray="2,6"/>

  <!-- Geometric Chevron Guides (subtle luxury engineering mark) -->
  <line x1="256" y1="46" x2="256" y2="58" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="256" y1="454" x2="256" y2="466" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="46" y1="256" x2="58" y2="256" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="454" y1="256" x2="466" y2="256" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Official Classic Chevrolet Bowtie Geometry -->
  <g filter="url(#elevate)">
    <!-- Main Emblem Body -->
    <path d="M 88,224
             L 214,224
             L 204,152
             L 308,152
             L 298,224
             L 424,224
             L 404,288
             L 298,288
             L 308,360
             L 204,360
             L 214,288
             L 108,288
             Z"
          fill="url(#chevyGold)"
          stroke="url(#goldEdge)"
          stroke-width="2.5"
          stroke-linejoin="round"/>

    <!-- Inner Facet Bevel Highlight (Chiseled Luxury Inset) -->
    <path d="M 112,236
             L 223,236
             L 215,168
             L 297,168
             L 289,236
             L 400,236
             L 384,276
             L 289,276
             L 297,344
             L 215,344
             L 223,276
             L 128,276
             Z"
          fill="url(#goldCore)"
          stroke="#fffbe8"
          stroke-opacity="0.4"
          stroke-width="1"
          stroke-linejoin="round"/>

    <!-- Specular Light Split -->
    <path d="M 88,224
             L 256,224
             L 256,152
             L 308,152
             L 298,224
             L 424,224
             L 340,256
             L 204,360
             L 214,288
             L 108,288
             Z"
          fill="#ffffff"
          opacity="0.08"/>
  </g>

  <!-- Clean Precision Automotive Subtitle -->
  <text x="256" y="426"
        font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif"
        font-size="19"
        font-weight="600"
        fill="#ffffff"
        fill-opacity="0.75"
        text-anchor="middle"
        letter-spacing="9">AVEO</text>

  <!-- Ambient Rim Flare Top-Left -->
  <ellipse cx="256" cy="18" rx="160" ry="2" fill="#ffffff" opacity="0.25"/>
</svg>
